<!DOCTYPE html>
<html>
<head>

<title>A Letter</title>

<style>

body{
background:#0d0d0d;
color:white;
font-family:Georgia, serif;
padding:40px;
max-width:800px;
margin:auto;
line-height:1.9;
font-size:20px;
}

h1{
text-align:center;
margin-top:80px;
font-weight:normal;
}

.fade{
opacity:0;
animation:appear 2s forwards;
}

@keyframes appear{
to{
opacity:1;
}
}

.quote{
font-style:italic;
text-align:center;
margin-top:50px;
margin-bottom:80px;
color:#cccccc;
}

</style>

</head>

<body>

<h1 class="fade">
For Someone Important
</h1>

<div class="quote">
"If you're reading this, then this was always meant for you."
</div>

<p>
Put your entire message here.
</p>

</body>

</html>
